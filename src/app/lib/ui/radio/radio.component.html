<ui-form-field>
  <div class="flex flex-col gap-2">
    @for (option of options(); track option.id) {
    <div class="flex items-center min-h-[32px]">
      <input
        type="radio"
        [id]="name() + '_' + option.id"
        [name]="name()"
        [checked]="value() === option.id"
        (change)="onSelect(option.id)"
        [disabled]="disabled()"
        [readonly]="readonly()"
        class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500 transition-all cursor-pointer disabled:opacity-50"
      />
      <label
        [for]="name() + '_' + option.id"
        class="ms-2 text-sm text-gray-700 cursor-pointer select-none"
      >
        {{ option.name }}
      </label>
    </div>
    }
  </div>
</ui-form-field>
