<ui-form-field>
  <div class="flex flex-col gap-2">
    @for (option of options(); track option.id) {
    <div class="flex items-center min-h-[32px]">
      @if (variant() === 'checkbox') {
      <input
        type="checkbox"
        [id]="name() + '_' + option.id"
        [checked]="isSelected(option.id)"
        (change)="onToggle(option.id)"
        [disabled]="disabled()"
        [readonly]="readonly()"
        class="w-5 h-5 rounded-sm border-2 border-gray-300 text-blue-600 focus:ring-blue-500 transition-all cursor-pointer disabled:opacity-50"
      />
      <label
        [for]="name() + '_' + option.id"
        class="ms-2 text-sm text-gray-700 cursor-pointer select-none"
      >
        {{ option.name }}
      </label>
      } @else {
      <button
        type="button"
        [id]="name() + '_' + option.id"
        (click)="onToggle(option.id)"
        [disabled]="disabled()"
        [attr.aria-checked]="isSelected(option.id)"
        role="switch"
        class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2 disabled:opacity-50"
        [class.bg-blue-600]="isSelected(option.id)"
        [class.bg-gray-200]="!isSelected(option.id)"
      >
        <span
          aria-hidden="true"
          class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"
          [class.translate-x-5]="isSelected(option.id)"
          [class.translate-x-0]="!isSelected(option.id)"
        ></span>
      </button>
      <label
        [for]="name() + '_' + option.id"
        (click)="onToggle(option.id)"
        class="ms-3 text-sm text-gray-700 cursor-pointer select-none"
      >
        {{ option.name }}
      </label>
      }
    </div>
    }
  </div>
</ui-form-field>
