<div class="h-dvh w-full bg-gray-50 p-2">
  <div class="h-full bg-white p-2 rounded-sm shadow flex flex-col overflow-y-auto">
    <div class="w-full flex">
      <div class="w-1/2">
        <app-dynamic-form-builder />
      </div>
      <div class="w-1/2">
        <app-dynamic-form [controls]="controls()">
          <ng-template #fieldTemplate let-control let-field="field">
            <app-form-field-renderer [control]="control" [field]="field" />
          </ng-template>
        </app-dynamic-form>
      </div>
    </div>
  </div>
</div>
