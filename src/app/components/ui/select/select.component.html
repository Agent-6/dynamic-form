<ui-form-field>
  <div class="w-full" (blur)="touched.set(true)">
    <div ngpSelect
      class="w-full flex h-10 items-center justify-between rounded-sm border-2 p-2 border-gray-200 data-focus:ring-2 data-focus:ring-black"
      [(ngpSelectValue)]="value" (ngpSelectOpenChange)="open.set($event)"
      [ngpSelectDropdownContainer]="dropdownContainer">

      @if (value(); as value) {
      <span class="text-sm">{{ selectedOptionLabel() }}</span>
      } @else {
      <span class="text-sm text-gray-600 dark:text-gray-400">{{ placeholder() }}</span>
      }

      <i [class]="{ 'bi-chevron-up': open(), 'bi-chevron-down': !open() }" class="bi"></i>
      <div
        class="absolute w-full z-1001 mt-1 max-h-60 overflow-y-auto rounded-sm border-2 p-1 bg-white border-gray-200 shadow-lg outline-hidden"
        *ngpSelectPortal ngpSelectDropdown>
        @for (option of options(); track option.id) {
        <div
          class="flex h-9 w-full cursor-pointer items-center gap-2 rounded-lg px-3 text-sm text-gray-800 data-active:bg-gray-100 data-hover:bg-gray-50 data-press:bg-gray-100 dark:text-gray-300 dark:data-active:bg-white/10 dark:data-hover:bg-white/5 dark:data-press:bg-white/10"
          [ngpSelectOptionValue]="option.id" ngpSelectOption>
          {{ option.name }}
        </div>
        } @empty {
        <div class="flex items-center justify-center p-2 text-center text-sm font-medium text-gray-500">
          No options found
        </div>
        }
      </div>
    </div>

    <div #dropdownContainer class="relative"></div>
  </div>
</ui-form-field>
