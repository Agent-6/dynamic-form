<div class="m-3 p-2 flex flex-col justify-items-center items-center rounded-sm">
  <form class="w-full">
    <h2 class="text-gray-950 text-xl font-extrabold mb-3">Dynamic Form Fields</h2>
    @for (control of controls(); track control.id) {

    @if (control) {
    <div class="flex flex-wrap gap-x-1">
      <!-- row -->
      <div class="mb-3 w-full flex flex-row gap-x-1">

        <div class="flex-1 flex flex-col gap-y-1">
          <span class="text-gray-500 text-sm font-mono">
            ID: {{ control.id }}
          </span>
          <div>
            <span class="font-semibold">
              {{ control.label || control.name }}
            </span>
            <!-- pills -->
            <span class="bg-gray-200 text-gray-800 rounded-full px-2 py-1 text-xs font-medium ml-2">
              {{ control.type }}
            </span>
          </div>
        </div>

        <!-- actions -->
        <div class="flex-none self-end flex flex-col gap-y-1">
          <div class="flex flex-row gap-1">
            <button type="button"
              class="w-10 h-10 text-gray-200 hover:text-white focus:text-white font-semibold bg-white hover:bg-black focus:bg-black border-2 border-gray-200 rounded-sm"
              (click)="configField(control.id)">
              <i class="text-lg bi bi-gear-fill"></i>
            </button>

            <button type="button"
              class="w-10 h-10 text-gray-200 hover:text-white focus:text-white font-semibold bg-white hover:bg-red-600 focus:bg-red-600 border-2 border-gray-200 rounded-sm"
              (click)="removeField(control.id)">
              <i class="text-lg bi bi-trash3-fill"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
    }
    }

    <div class="w-full flex my-3">
      <button type="button"
        class="ms-auto p-2 text-white font-semibold bg-black hover:bg-gray-900 focus:bg-gray-900 rounded-sm"
        (click)="addField()">
        <i class="bi bi-plus-lg"></i> New Field
      </button>
    </div>
  </form>

  <pre
    class="w-full h-full rounded-sm bg-gray-950 text-white p-2 text-sm font-mono overflow-auto max-h-96">{{ controls() | json }}</pre>
</div>

@if (show()) {
<div class="fixed inset-0 bg-black/50 flex justify-center items-center z-40">
  <div class="relative w-1/2 max-h-4/5 z-50">
    <app-dynamic-field-form [(show)]="show" [controlId]="selectedId()"></app-dynamic-field-form>
  </div>
</div>
}
