<div class="m-3 p-2 flex flex-col justify-items-center items-center rounded-sm">
  <form class="w-full">
    <h2 class="text-gray-950 text-xl font-extrabold mb-3">Generated Dynamic Form</h2>
    @for (control of controls(); track control.id) {

    <div class="w-full mb-3">
      <ng-container
        [ngTemplateOutlet]="fieldTemplate() || defaultTemplate"
        [ngTemplateOutletContext]="{ $implicit: control, field: getField(control) }"
      />
    </div>

    <ng-template #defaultTemplate let-control let-field="field">
      @if (isText(control)) {
      <ui-input [label]="control.label || ''" [placeholder]="control.placeholder" [formField]="field"
        [type]="control.type"></ui-input>
      }
      @else if (isNumber(control)) {
      <ui-number [label]="control.label || ''" [placeholder]="control.placeholder" [formField]="field"></ui-number>
      }
      @else if (isSelect(control)) {
      <ui-select [label]="control.label || ''" [placeholder]="control.placeholder" [formField]="field"
        [options]="control.options"></ui-select>
      }
    </ng-template>
    }

    <div class="w-full flex my-3">
      <button type="button"
        class="ms-auto p-2 text-white font-semibold bg-black hover:bg-gray-900 focus:bg-gray-900 rounded-sm"
        (click)="submit()" [disabled]="form().submitting()">Submit</button>
    </div>
  </form>

  <pre
    class="w-full h-full rounded-sm bg-gray-950 text-white p-2 text-sm font-mono overflow-auto max-h-96">{{ formState() | json }}</pre>
</div>
